<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myanmar Local Artists</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background: #1b1b1b;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #aaa;
    }

    .artists {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .artist-card {
      background: #1d1d1d;
      border-radius: 15px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 15px;
      transition: 0.3s;
    }

    .artist-card:hover {
      transform: translateY(-5px);
    }

    .artist-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .artist-card h3 {
      margin: 15px 5px 5px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Myanmar Local Artists</h1>
    <p>Discover Myanmar's local artists</p>
  </header>

  <div class="artists">

    <div class="artist-card">
      <img src="images/two-two-three.jpg">
      <h3>Two Two Three</h3>
    </div>

    <div class="artist-card">
      <img src="images/w4wink.jpg">
      <h3>w4wink</h3>
    </div>

    <div class="artist-card">
      <img src="images/arki.jpg">
      <h3>Arki</h3>
    </div>

    <div class="artist-card">
      <img src="images/ah-sar.jpg">
      <h3>Ah Sar</h3>
    </div>

    <div class="artist-card">
      <img src="images/kee-bio.jpg">
      <h3>Kee Bio</h3>
    </div>

    <div class="artist-card">
      <img src="images/roload.jpg">
      <h3>Roload</h3>
    </div>

    <div class="artist-card">
      <img src="images/myat-amara-maung.jpg">
      <h3>Myat Amara Maung</h3>
    </div>

    <div class="artist-card">
      <img src="images/yung-punch.jpg">
      <h3>Yung Punch</h3>
    </div>

    <div class="artist-card">
      <img src="images/murkio.jpg">
      <h3>Murkio</h3>
    </div>

  </div>

</body>
</html>
