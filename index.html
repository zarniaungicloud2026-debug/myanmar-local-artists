<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myanmar Local Artists</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #aaa;
    }

    .artists {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .artist-card {
      background: #1d1d1d;
      border-radius: 15px;
      overflow: hidden;
      text-align: center;
    }

    .artist-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .artist-card h3 {
      margin: 0;
      padding: 14px 5px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Myanmar Local Artists</h1>
    <p>Discover Myanmar Local Artists</p>
  </header>

  <div class="artists">

    <div class="artist-card">
      <img src="IMG_1171.jpeg" alt="Two Two Three">
      <h3>Two Two Three</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1172.jpeg" alt="w4wink">
      <h3>w4wink</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1173.jpeg" alt="Arki">
      <h3>Arki</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1176.jpeg" alt="Ah Sar">
      <h3>Ah Sar</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1179.jpeg" alt="Kee Bio">
      <h3>Kee Bio</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1180.jpeg" alt="Roload">
      <h3>Roload</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1181.jpeg" alt="Myat Amara Maung">
      <h3>Myat Amara Maung</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1182.jpeg" alt="Yung Punch">
      <h3>Yung Punch</h3>
    </div>

    <div class="artist-card">
      <img src="IMG_1183.jpeg" alt="Murkio">
      <h3>Murkio</h3>
    </div>

  </div>

</body>
</html>
